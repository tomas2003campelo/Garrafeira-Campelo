<!DOCTYPE html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logótipo final</title><style>body{margin:0;padding:20px 16px 40px;background:#2A1E20;color:#F4EADF;font:15px -apple-system,sans-serif}h1{font-family:Georgia,serif}h2{margin:28px 0 10px;font-weight:600}.g{display:flex;flex-wrap:wrap;gap:12px}figure{margin:0;padding:24px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;max-width:100%}figure img{max-width:100%;height:auto;display:block}figcaption{font-size:12px;color:#777;text-align:center}figure[style*="#1A1214"] figcaption{color:#BDAAA1}code{font-size:11px}</style></head><body><h1>Garrafeira Campelo, logótipo final</h1><p>Cantaria com a casa. Os PNG têm fundo transparente: cada um aparece aqui no fundo para que foi feito.</p><h2>Marca</h2><div class=g><figure style="background:#1A1214"><img src="png/marca-para-fundo-escuro.png" style="width:180px"><figcaption>Para fundo escuro<br><code>marca-para-fundo-escuro</code></figcaption></figure><figure style="background:#F2E6D6"><img src="png/marca-para-fundo-claro.png" style="width:180px"><figcaption>Para fundo claro<br><code>marca-para-fundo-claro</code></figcaption></figure><figure style="background:#FFFFFF"><img src="png/marca-uma-cor.png" style="width:180px"><figcaption>Uma cor só (preto)<br><code>marca-uma-cor</code></figcaption></figure></div><h2>Horizontal</h2><div class=g><figure style="background:#1A1214"><img src="png/horizontal-para-fundo-escuro.png" style="width:520px"><figcaption>Para fundo escuro<br><code>horizontal-para-fundo-escuro</code></figcaption></figure><figure style="background:#F2E6D6"><img src="png/horizontal-para-fundo-claro.png" style="width:520px"><figcaption>Para fundo claro<br><code>horizontal-para-fundo-claro</code></figcaption></figure><figure style="background:#FFFFFF"><img src="png/horizontal-uma-cor.png" style="width:520px"><figcaption>Uma cor só (preto)<br><code>horizontal-uma-cor</code></figcaption></figure></div><h2>Vertical</h2><div class=g><figure style="background:#1A1214"><img src="png/vertical-para-fundo-escuro.png" style="width:360px"><figcaption>Para fundo escuro<br><code>vertical-para-fundo-escuro</code></figcaption></figure><figure style="background:#F2E6D6"><img src="png/vertical-para-fundo-claro.png" style="width:360px"><figcaption>Para fundo claro<br><code>vertical-para-fundo-claro</code></figcaption></figure><figure style="background:#FFFFFF"><img src="png/vertical-uma-cor.png" style="width:360px"><figcaption>Uma cor só (preto)<br><code>vertical-uma-cor</code></figcaption></figure></div><h2>Ícone e Instagram</h2><div class=g><figure style="background:#DEE1E6"><img src="png/favicon-32.png" style="width:32px"><img src="png/favicon-16.png" style="width:16px"><img src="png/favicon.png" style="width:120px"><figcaption>favicon (16, 32, 512 px)</figcaption></figure><figure style="background:#fff"><img src="png/perfil-instagram.png" style="width:180px;border-radius:50%"><figcaption>perfil-instagram, como o Instagram o corta</figcaption></figure></div></body></html>
